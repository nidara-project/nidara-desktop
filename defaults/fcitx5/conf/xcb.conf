# Nidara — fcitx5, X11/XWayland addon.
#
# The keyboard layout belongs to the compositor. fcitx5's default group is
# hardcoded to `Default Layout=us` (fcitx5 `inputmethodmanager.cpp`,
# buildDefaultGroup: it does NOT read your locale), and with this option on it
# pushes that layout onto X — which would quietly undo the layout the installer
# and Settings agreed on, for every XWayland app.
#
# Same guard Omarchy ships, for the same reason.
Allow Overriding System XKB Settings=False
