# ── Nidara default kitty.conf ────────────────────────────────────────────────
# Seeded once by nidara-setup; after that this file is yours — Nidara updates
# never touch it. Full option reference: https://sw.kovidgoyal.net/kitty/conf/
# ─────────────────────────────────────────────────────────────────────────────

# Keep text clear of Hyprland's rounded corners (Nidara default: rounding 24).
# Without padding the first/last rows get clipped by the corner radius.
window_padding_width 16

# The monospace font Nidara ships. kitty doesn't read the system (gsettings)
# monospace preference, so it has to be named here as well.
font_family      JetBrains Mono
font_size        11.0

# Nerd Font pictograms (Powerline separators, devicons, Font Awesome — what a
# fancy shell prompt draws) come from a SEPARATE font, so the ranges are pinned
# to it explicitly rather than left to fontconfig. That is not belt-and-braces:
# Adwaita Mono and Inter also claim U+E0B0, and whichever fontconfig happens to
# rank first would decide how your prompt's separators look.
symbol_map U+E000-U+E00A,U+E0A0-U+E0A2,U+E0A3,U+E0B0-U+E0B3,U+E0B4-U+E0C8 Symbols Nerd Font Mono
symbol_map U+E0CA,U+E0CC-U+E0D7,U+E200-U+E2A9,U+E300-U+E3E3 Symbols Nerd Font Mono
symbol_map U+E5FA-U+E6B7,U+E700-U+E8EF,U+EA60-U+EC1E,U+ED00-U+EFCE Symbols Nerd Font Mono
symbol_map U+F000-U+F2FF,U+F300-U+F381,U+F400-U+F533,U+F0001-U+F1AF0 Symbols Nerd Font Mono

# Glass: Hyprland blurs translucent windows, so a see-through terminal picks
# up the frosted Nidara look. 0.9 errs on the readable side; lower it toward 0.5
# for deeper glass, or adjust live with Ctrl+Shift+A then M (more) / L (less) /
# D (default).
background_opacity 0.9
dynamic_background_opacity yes

# ── Colors: dark, and NOT following the Appearance toggle ────────────────────
# Every other Nidara surface follows light/dark. This one does not, and the
# reason is measured rather than a matter of taste. A terminal shows colored
# output — ls, git, build logs, any TUI — and those colors are chosen against a
# dark background. Run scripts/dev/terminal-contrast.py to see it: on the light
# palette this file used to ship, SEVEN of the fourteen ANSI colors fall below a
# 3:1 contrast ratio, with bright yellow at 1.2:1, which is invisible. On this
# one, none do. Plain text was never the problem — measured on screen through
# the glass, the light theme gave 8.7:1, comfortably past WCAG AAA. The color
# was the problem.
#
# kitty's own default is dark too; the light variant was ours.
#
# To make the terminal follow the system scheme anyway, put color settings in
# ~/.config/kitty/{dark,light,no-preference}-theme.auto.conf — kitty picks one
# from the system color scheme and switches live. Nidara used to seed that trio
# and no longer does. If you write a light palette, measure it first.

foreground #dddddd
background #000000
cursor     #cccccc

color0  #000000
color8  #767676
color1  #cc0403
color9  #f2201f
color2  #19cb00
color10 #23fd00
color3  #cecb00
color11 #fffd00
color4  #0d73cc
color12 #1a8fff
color5  #cb1ed1
color13 #fd28ff
color6  #0dcdcd
color14 #14ffff
color7  #dddddd
color15 #ffffff

cursor_shape     beam
cursor_blink_interval 0.5

# No audible ding.
enable_audio_bell no

# Ask before closing a window ONLY when a process is still running in it
# (an idle shell closes silently). Set to 0 to never be asked.
confirm_os_window_close -1
