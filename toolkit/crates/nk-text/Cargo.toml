[package]
name = "nk-text"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["parley"]
parley = ["dep:parley"]
system-fonts = ["parley", "parley/system", "dep:fontique"]

[dependencies]
parley = { version = "0.12", default-features = false, features = ["std", "complex-scripts"], optional = true }
unicode-segmentation = "1.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ttf-parser = "0.25"

fontique = { version = "0.12", default-features = false, features = ["fontconfig-dlopen"], optional = true }
