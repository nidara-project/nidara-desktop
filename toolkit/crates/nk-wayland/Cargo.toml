[package]
name = "nk-wayland"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
bitflags = "2"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "unstable", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
wayland-scanner = "0.31"
wayland-backend = "0.3"
xkbcommon = { version = "0.9", features = ["wayland"] }
memmap2 = "0.9"
rustix = { version = "1", features = ["event", "fs", "net", "pipe"] }

[dev-dependencies]
# The server backend Hyalo uses, for output-identity tests (SHELL-SURFACES.md §2).
wayland-server = "0.31"
