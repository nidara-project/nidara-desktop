# SPDX-License-Identifier: LGPL-3.0-or-later
[package]
name = "nk-settings"
description = "The native Settings app of toolkit phase 1 (#915)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
nk-a11y = { path = "../crates/nk-a11y" }
nk-render = { path = "../crates/nk-render" }
nk-text = { path = "../crates/nk-text", features = ["system-fonts"] }
nk-widgets = { path = "../crates/nk-widgets" }
nk-wayland = { path = "../crates/nk-wayland" }
serde_json = "1"
unicode-normalization = "0.1"
async-channel = "2.5"
async-io = "2.6"
futures-lite = "2.6"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "avif-native"] }
zbus = "5.19"
jpeg-decoder = { version = "0.3.2", default-features = false }

nk-icons = { path = "../crates/nk-icons" }

[features]
ime-gates = ["nk-widgets/ime-gates"]

[[bin]]
name = "nk-settings-ime"
path = "src/bin/nk-settings-ime.rs"
required-features = ["ime-gates"]
