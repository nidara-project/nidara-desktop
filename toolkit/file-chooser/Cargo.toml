[package]
name = "nidara-file-chooser"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
nidara-kit = { path = "../crates/nidara-kit" }
nk-icons = { path = "../crates/nk-icons" }
nk-platform = { path = "../crates/nk-platform" }
nk-render = { path = "../crates/nk-render" }
nk-text = { path = "../crates/nk-text", features = ["system-fonts"] }
nk-wayland = { path = "../crates/nk-wayland" }
gio = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zbus = "5.19"
