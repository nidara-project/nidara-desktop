# SPDX-License-Identifier: LGPL-3.0-or-later
[package]
name = "nk-gallery"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Installed as an application (nidara-gallery.desktop): Apps lists it as any other.
[[bin]]
name = "nidara-gallery"
path = "src/main.rs"

[dependencies]
nk-view = { path = "../crates/nk-view" }
nk-text = { path = "../crates/nk-text", features = ["system-fonts"] }
nk-render = { path = "../crates/nk-render" }
nk-a11y = { path = "../crates/nk-a11y" }
nk-wayland = { path = "../crates/nk-wayland" }
nk-platform = { path = "../crates/nk-platform" }
nk-icons = { path = "../crates/nk-icons" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zbus = "5.19"
