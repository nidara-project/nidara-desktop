# CI — automated checks that run on every push and pull request.
#
# What this is: a robot on GitHub that, every time code is pushed, verifies the
# project still assembles correctly. A green check = safe; a red check = something
# to look at, caught BEFORE it reaches the running shell.
#
# Gates here:
#   - styles: the SCSS stylesheet compiles (catches CSS syntax errors). Pure JS,
#     no system libraries needed.
#   - typecheck: `tsc --noEmit` over ui/shell. The GI typings it needs (@girs/,
#     ~58 MB generated, git-ignored) can't be produced on a runner —
#     scripts/gen-types.sh reads the system's .gir files, which means a machine
#     with the whole GI stack installed. Instead a maintainer publishes a ~4 MB
#     compressed snapshot as an asset on the `ci-assets` release
#     (scripts/dev/publish-ci-typings.sh) and this job downloads it. tsc needs no
#     node_modules at all. If this job fails on a type that exists locally, the
#     snapshot is stale → re-run the publish script.
#   - widgets-gen: the committed widgets.gen.ts (widget auto-registration) is
#     fresh — regenerates it with scripts/gen-widget-index.mjs and fails if it
#     differs. Pure node; also surfaces the codegen's own validation errors
#     (stray non-widget file in widgets/, duplicate widget id).
#   - skill-docs: two pure-node checks on things a reader cannot hold in their head.
#     (1) The in-repo skill does not say the same thing twice: `design-system.md`
#     once held 1157 duplicated lines — half the file, twice — and edits then landed
#     in DIFFERENT COPIES, so the reference contradicted itself for weeks. Nobody
#     sees that by reading, because a long reference is read by search. Logic in
#     scripts/ci/skill-docs-check.mjs. (2) Every wrapping GtkLabel fills its column
#     rather than picking its own break point — a rule design-system.md already
#     stated and six labels violated anyway, because it only shows once a string is
#     long enough to wrap, i.e. in a locale or text size that is not yours. Logic in
#     scripts/ci/wrapping-prose-check.mjs.
#   - smoke: the REAL thing — load the kernel's vkms (virtual KMS) on the
#     runner, then in a privileged Arch container install ONLY official Arch
#     packages, bundle the shell with scripts/bundle.sh (esbuild), boot Hyprland
#     on the virtual display (llvmpipe software GL), boot
#     the bundle on it, and require: process stays alive, IPC answers
#     (listActions/dumpState), no JS errors in the boot log. Screenshots are
#     uploaded as artifacts for HUMAN review — deliberately not a pixel diff.
#     All logic lives in scripts/ci/headless-smoke.sh.
#   - agent-loop: drive the real Assistant daemon (bin/nidara-agent) through one
#     tool-use turn against a mock OpenAI-compatible provider — asserts the stream
#     parsing (tool call, split args, final text) AND both halves of the 5xx retry
#     policy (a 503 is retried past, a 4xx surfaces without retry). Hermetic: no
#     network, key, or running shell — only gjs. Logic in
#     scripts/ci/agent-loop-test.py.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  # ⚠️ REQUIRED BY THE MERGE QUEUE, and the way it fails is a stall, not an error.
  # A queued PR waits for the four required checks (styles / typecheck / smoke /
  # widgets-gen) to report against the QUEUE's temporary merge_group ref. Without
  # this trigger those checks simply never start there, so the entry sits in the
  # queue until it times out and gets kicked — with the PR itself still showing
  # eight green checks from its `pull_request` run. Nothing anywhere says "you
  # forgot a trigger".
  #
  # This is also why the trigger has to be on main BEFORE the queue is turned on:
  # the queue runs the workflow as it exists on the base branch.
  merge_group:

jobs:
  styles:
    name: Build styles (SCSS)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Compile SCSS (must succeed)
        working-directory: ui/shell
        run: npx --yes sass@1.97.3 --no-charset style.scss /tmp/style.css

      # The greeter/lockscreen sheet (one file, both bundles) was compiled by
      # nothing here until 2026-08-10, and it is the one that could least afford
      # it: those two surfaces have NO dev mode — they load a fixed
      # /usr/share path, so a break shows up only when someone boots a VM.
      # It now `@use`s ui/lib/styles/, which the shell's compile above already
      # gates for syntax, but not for what the GREETER needs from it (its own
      # `radius-vars`, its own token contract). Cheap, and it closes the gap the
      # kit import opened.
      - name: Compile the greeter/lock SCSS (must succeed)
        working-directory: ui/shell
        run: npx --yes sass@1.97.3 --no-charset ../greeter/style.scss /tmp/greeter.css

  pkgbuild:
    name: PKGBUILD parses
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # `bash -n` only, not a full makepkg: this catches the class that actually
      # bit (v0.6.0, an unquoted `hyprland>=0.56` — bash read `>` as a
      # redirection, the depends=() array never closed and the file stopped
      # sourcing), and it needs no Arch container. A broken PKGBUILD breaks the
      # LOCAL package build for every user, which is the path install.sh takes
      # whenever nidara-repo does not yet serve the release — i.e. the first
      # minutes of every release.
      - name: bash -n packaging/nidara/PKGBUILD (must parse)
        run: bash -n packaging/nidara/PKGBUILD
      # depends=() must survive sourcing as a real array — a syntax error can
      # truncate it silently rather than fail loudly.
      - name: depends=() sources as a non-empty array
        run: |
          source <(sed -n '/^depends=(/,/^)/p' packaging/nidara/PKGBUILD)
          echo "depends: ${#depends[@]}"
          [ "${#depends[@]}" -ge 40 ] || { echo "::error::depends=() collapsed to ${#depends[@]}"; exit 1; }

  typecheck:
    name: Typecheck (tsc)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Download @girs snapshot (ci-assets release)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release download ci-assets --repo "$GITHUB_REPOSITORY" \
               --pattern girs-snapshot.tar.zst --output /tmp/girs-snapshot.tar.zst; then
            echo "::error::No @girs snapshot found on the 'ci-assets' release."
            echo "A maintainer must publish it once: scripts/dev/publish-ci-typings.sh"
            exit 1
          fi
          tar --zstd -xf /tmp/girs-snapshot.tar.zst -C ui/shell
          echo "Extracted @girs: $(du -sh ui/shell/@girs | cut -f1)"
      - name: tsc --noEmit (must succeed)
        working-directory: ui/shell
        run: npx --yes -p typescript@5.7.3 tsc --noEmit -p tsconfig.json

      # ── greeter + lockscreen: NAMES ONLY, and that is a deliberate ceiling ──
      # These two bundles cannot be fully typechecked yet. Their `gi.d.ts` declares
      # `Gtk`/`Gdk` as VALUES (`export const Gtk: any`), so every `Gtk.Widget` used
      # as a TYPE reports "Cannot find namespace" — ~40 errors that are all the
      # shim's shape, not the code's. Giving them the real @girs is the proper fix
      # and it is not free (the snapshot is built for the shell's GI set; these two
      # also need AstalGreet and Gtk4LayerShell).
      #
      # So this gate filters to TS2304/TS2552 — "Cannot find name X" — which is
      # exactly the class that has actually shipped a bug, and which the namespace
      # noise was hiding. On 2026-08-10 `LoginCard.ts` still called `syncCaps()`,
      # deleted by #100 the day before along with the caps-lock warning it belonged
      # to. It was the FIRST statement of the card's `map` handler, so every login
      # threw a ReferenceError and the two `timeout_add`s after it never ran: the
      # card stayed at `opacity: 0` and the password field never took focus. It
      # reached main because nothing typechecked this bundle and these surfaces have
      # no dev mode — a fixed /usr/share path, so a repo build proves nothing.
      #
      # Both bundles are clean under this filter. Raise the ceiling by fixing the
      # typings, not by loosening the grep.
      - name: No undefined identifiers in greeter / lockscreen
        run: |
          fail=0
          for b in greeter lockscreen; do
            out=$(cd "ui/$b" && npx --yes -p typescript@5.7.3 tsc --noEmit -p tsconfig.json 2>&1 \
                  | grep -E 'TS2304|TS2552' || true)
            if [ -n "$out" ]; then
              echo "::error::ui/$b references names that do not exist:"
              echo "$out"
              fail=1
            else
              echo "ui/$b: no undefined identifiers"
            fi
          done
          exit $fail

  smoke:
    name: Headless boot smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # Hyprland cannot boot with zero DRM devices (aquamarine's allocator
      # needs a node — see the header of headless-smoke.sh), so give the
      # runner a VIRTUAL one: the kernel's vkms module. The Arch container
      # then gets /dev/dri via --privileged.
      - name: Load vkms (virtual KMS device)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq "linux-modules-extra-$(uname -r)"
          sudo modprobe vkms
          ls -l /dev/dri
      # No dependency cache any more (2026-08-18): the smoke used to build the
      # pinned Astal/AGS stack from source and cache the result as a tarball.
      # Nothing is built from source here now — every package comes from Arch's
      # own repos — so the cache, its month stamp and its two-file hash key are
      # gone with it. (That key was itself a trap worth remembering: it hashed
      # BOTH install.sh and headless-smoke.sh because the pins live in one and
      # the library list in the other, and keying on just one would have restored
      # a tarball proving a removal that never happened.)
      - name: Bundle + headless boot (Arch container on vkms)
        run: |
          docker run --rm --privileged \
            -v "$PWD:/repo" \
            archlinux:latest bash /repo/scripts/ci/headless-smoke.sh
      - name: Upload screenshots + logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-artifacts
          path: smoke-out/
          if-no-files-found: ignore

  widgets-gen:
    name: Widget registry freshness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Regenerate widgets.gen.ts (must succeed)
        run: node scripts/gen-widget-index.mjs
      - name: Verify committed file is fresh
        run: |
          if ! git diff --exit-code -- ui/shell/widgets/widgets.gen.ts; then
            echo "::error::ui/shell/widgets/widgets.gen.ts is STALE."
            echo "Fix: run 'node scripts/gen-widget-index.mjs' and commit the updated widgets.gen.ts alongside your widget change."
            exit 1
          fi

  hypr-config:
    name: Hyprland config (parses + game mode)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install lua
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lua5.4
      # The session's whole config is one Lua chunk: a syntax error anywhere in it
      # means Hyprland starts with NO Nidara config at all — no keybinds, no rules,
      # no game mode. `luac -p` needs none of the `hl` API to catch that.
      - name: luac -p config/hypr/hyprland.lua (must parse)
        run: luac5.4 -p config/hypr/hyprland.lua
      # Beyond parsing, the game-mode handlers are the one part of this file with
      # state that outlives a single event (what the profile and wallpaper were
      # before the game). The harness stubs `hl` and drives the handlers directly,
      # so it needs neither Hyprland nor Steam.
      - name: Game-mode session handlers (must succeed)
        run: lua5.4 scripts/dev/hypr-game-mode-test.lua

  skill-docs:
    name: Docs + prose shape
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: No repeated headings in .claude/skills (must succeed)
        run: node scripts/ci/skill-docs-check.mjs
      # A wrapping GtkLabel must FILL its column. The rule was written in
      # design-system.md and violated six times anyway, because the failure only
      # shows once a string is long enough to wrap — which depends on the locale and
      # the text-size setting, i.e. on someone else's machine.
      - name: Wrapping prose fills its column (must succeed)
        run: node scripts/ci/wrapping-prose-check.mjs

  i18n:
    name: Translations (parity + ledger)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      # Two releases shipped with 82 keys missing from ten locales and nobody noticed
      # the number move to 84, because no artifact recorded it. This fails when the
      # committed ledger no longer matches the catalogs — so untranslated and stale
      # keys land in the PR's own diff — and on the parity rules that must always be
      # zero (es out of sync with en, orphan keys, greeter/lock mini-catalogs).
      - name: Translation ledger is fresh + parity holds (must succeed)
        run: node scripts/ci/i18n-check.mjs --check

  agent-loop:
    name: Assistant loop (nidara-agent)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # The daemon is plain GJS (no Node) and imports gi://Secret, so the runner
      # needs the gjs interpreter and the libsecret typelib. curl + python3 are
      # already on ubuntu-latest. gjs pulls the GLib/Gio/GioUnix typelibs it needs.
      - name: Install gjs + libsecret typelib
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gjs gir1.2-secret-1
      - name: Drive nidara-agent against a mock provider (must succeed)
        run: python3 scripts/ci/agent-loop-test.py
