# Hyalo's shipped configuration — installed as /usr/share/nidara/hyalo/hyalo.toml.
#
# Your own settings go in ~/.config/nidara/hyalo.toml: it is read on top of this file, key
# by key, so you only write what you change. Both are watched; an edit applies at once.
# `nidara-hyalo msg` changes things for the running session without touching either file.
#
# Every key, with its meaning: hyalo/compositor/src/config.rs.

# Run once the compositor is up, in order, through `sh -c` — only in a real session
# (`nidara-hyalo --session`, which is how the greeter's session entry starts it), never in
# a development window.
autostart = [
  # Tell uwsm the compositor is ready: it exports WAYLAND_DISPLAY (and the IPC socket) to the
  # session's services and activates graphical-session.target. Must come first — uwsm ends
  # the session if this does not arrive.
  "uwsm finalize HYALO_SOCKET",
  # The shell, as a systemd user unit, so a crash restarts it rather than leaving a bare
  # compositor (bin/nidara.service).
  "systemctl --user start nidara.service",
  # The wallpaper: awww draws it; the user's choice is in ~/.config/nidara/wallpaper.
  "uwsm app -s b -- awww-daemon",
  "/usr/lib/nidara-hyalo/restore-wallpaper",
  "uwsm app -s b -- /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1",
  # Completes the keyring PAM unlocked at login (see config/hypr/hyprland.lua for why this
  # line is not a formality).
  "uwsm app -s b -- gnome-keyring-daemon --start --components=secrets",
  # The clipboard history (the Control Center's clipboard panel): wl-paste watches through
  # data-control and hands every copy to cliphist. TWO watchers, one per type: with no --type
  # wl-paste prefers any text flavour, so a browser's "Copy image" (image/png plus the URL as
  # text) stored the URL every time and no image ever reached the history. A copy with both
  # lands twice, one row each. 50 items, not cliphist's 750: our panel is a list with no
  # search, and images are what costs (eighteen items over 1 MB were 50 of 60 MB measured).
  # Trimmed on the next store, all at once.
  "uwsm app -s b -- wl-paste --type text --watch cliphist -max-items 50 store",
  "uwsm app -s b -- wl-paste --type image --watch cliphist -max-items 50 store",
]

# How windows are laid out — the Hyprland session's numbers, so the bar's ends line up with
# the windows the same way in both sessions.
[layout]
tiling = "dwindle"   # the only tiling layout for now (#682)
gaps_in = 2          # each side, so 4 between two windows
gaps_out = 4         # = the bar's margin (ui/shell/surfaces/bar/capsule.ts BAR_MARGIN)
border = 1

# Floating or tiling, per workspace; Settings writes `modes` in hyalo-settings.toml.
[workspaces]
default_mode = "floating"

# Window rules, by name (hyalo/compositor/src/wm/rules.rs). A rule applies to a window ONCE,
# the first time it matches: when it opens, or later when it renames itself — so our windows
# are matched by the app id they stamp when shown, which Hyprland's rules never see (#679,
# item 13; config/hypr/hyprland.lua matches About by its title for that reason). `match` is
# regexes searched in app_id / title / initial_app_id / initial_title, and `game = true`
# for a game (wm/games.rs); effects: float, center, workspace ("3", "special:NAME" or
# "name:NAME") with silent; rounding = false (square corners), backdrop = false (no blur
# behind it), title_bar = false (no Hyalo title bar) and controls = ["close"] (the only buttons
# its window controls may show). Your hyalo.toml can add a rule, replace one by its name, or switch one off with
# `enabled = false`. (The rest of hyprland.lua's rules wait for XWayland and animations, #684.)
[rules.about]
match = { app_id = "^nidara-about$" }
float = true
center = true

[rules.installer]
match = { app_id = "^(org\\.nidara\\.installer|nidara-installer)$" }
center = true

# Game mode: a game gets a workspace of its own, and the user goes with it. The session around
# it — wallpaper, power profile, notifications, the way back when it closes — is the shell's
# (ui/shell/core/GameSession.ts), from Settings → Gaming.
[rules.games]
match = { game = true }
workspace = "name:gamespace"
rounding = false

# A window with no app id — a client's popup made a toplevel — stays square, as Hyprland's
# `general-popups` kept it.
[rules.no-app-id]
match = { app_id = "^$" }
rounding = false

# How windows are drawn (hyalo/compositor/src/render/window.rs): what Hyprland drew for Nidara.
# Corners: `rounding` px, `rounding_power` the curve (2 a circle, higher a squircle); never on a
# fullscreen window, nor on one that draws its own decoration with a shadow. The backdrop: the
# blur behind every translucent window — the WINDOW material, apart from the shell's glass:
# Hyprland's `decoration:blur`, its numbers (size, passes, contrast, brightness, vibrancy,
# noise). Settings → Appearance → Windows switches it (`backdrop.enabled`); a rule with
# `backdrop = false` takes it from one app.
[windows]
rounding = 24
rounding_power = 3.2

# The window controls (close, minimize, maximize) Hyalo draws over an app's header, where the
# app reserved room for them: `side` "right" or "left", and the `buttons` the user wants (close
# is always shown; a window that cannot do one does not show it — no minimize on a dialog, no
# maximize on a window that cannot change size). The
# shell keeps both equal to org.gnome.desktop.wm.preferences button-layout, which Settings →
# Appearance → Windows writes and the apps that draw their own title bar read.
[windows.controls]
side = "right"
buttons = ["minimize", "maximize", "close"]

# The title bar Hyalo draws for an app that leaves its decorations to the compositor (kitty, Qt
# apps, Chrome with "Use system title bar and borders"): one piece with the window — the colour
# of the app's top row — with the controls above and the title (hyalo/compositor/src/render/
# title_bar.rs). `font` is the title's family; the shell keeps it in step with the interface
# font (Settings → Appearance). A rule with `title_bar = false` takes the bar from one app.
[windows.title_bar]
font = "Inter"

[windows.backdrop]
enabled = true
size = 2
passes = 2
contrast = 1.2
brightness = 1.0
vibrancy = 0.4
vibrancy_darkness = 0.1
noise = 0.01

# The line around every window, outside its box and following its corners — Hyprland's for
# Nidara: a light gradient (`active`, from the first colour to the second at `angle` degrees)
# on the focused window, a faint grey on the others. `#rrggbb` or `#rrggbbaa`; width 0 = none.
# Its room is `[layout] border` (hyalo/compositor/src/render/decor.rs).
[windows.border]
width = 1
active = ["#ffffff4d", "#ffffff1a"]
angle = 45
inactive = "#59595933"

# The shadow under every window: deeper under the focused one. `range` how far it reaches past
# the edge and `offset` how far it falls, logical px; it fades as (1 - t)^power. Not on a
# fullscreen window, nor where a rule took the corners (games).
[windows.shadow]
enabled = true
power = 2
active = { range = 20, offset = 4, color = "#00000059" }
inactive = { range = 12, offset = 2, color = "#00000033" }

# Key and pointer bindings: modifiers + key = a command (hyalo/compositor/src/binds.rs for
# the syntax, wm/actions.rs for the commands). The same set as the Hyprland session
# (config/hypr/hyprland.lua). No binding ends the session on purpose — one stray chord must
# never lose everything; log out from the system menu. (Ctrl+Alt+Backspace, built in, is
# the preview's way out until it is not a preview.)
[binds]
# The shell.
"Super+Shift+R" = "spawn systemctl --user restart nidara.service"
"Super+L" = "spawn nidara-lock"
"Super+S" = "spawn nidara-ipc openSettings"
"Super_L" = { action = "spawn nidara-ipc toggleAppGrid", release = true }
"Super+A" = "spawn nidara-ipc toggleAgent"
"Super+B" = "spawn nidara-ipc toggleBarOverlay"
"Super+Shift+G" = "spawn nidara-game-mode toggle"
# The kill switch and the way back from an app that holds the shortcuts (a VM, a remote
# desktop) work even then: `dont_inhibit` (hyalo/compositor/src/shortcuts.rs).
"Super+Shift+Escape" = { action = "spawn nidara-ipc disableComputerControl", dont_inhibit = true }
"Super+Escape" = { action = "toggle-shortcuts-inhibit", dont_inhibit = true }
"Super+Space" = "spawn nidara-ipc togglePrism"
"Super+C" = "spawn nidara-ipc toggleCC keyboard"
"Super+N" = "spawn nidara-ipc toggleNC keyboard"
"Super+Ctrl+B" = "spawn nidara-ipc focusBar"
"Super+Ctrl+D" = "spawn nidara-ipc focusDock"
"Super+W" = "spawn nidara-ipc toggleOverview"
# Apps, launched as the shell launches them (uwsm app -t service: the session's
# environment, and a unit name the portal can identify the app by).
"Super+E" = "spawn uwsm app -t service -- org.gnome.Nautilus.desktop"
"Super+T" = "spawn uwsm app -t service -- kitty.desktop"
# Windows.
"Super+Q" = "close-window"
"Super+Left" = "focus left"
"Super+Right" = "focus right"
"Super+Up" = "focus up"
"Super+Down" = "focus down"
"Alt+Tab" = "cycle next"
"Alt+Shift+Tab" = "cycle prev"
"Super+MouseLeft" = "move-with-pointer"
"Super+MouseRight" = "resize-with-pointer"
"Super+Shift+Right" = { action = "resize 30 0", repeat = true }
"Super+Shift+Left" = { action = "resize -30 0", repeat = true }
"Super+Shift+Up" = { action = "resize 0 -30", repeat = true }
"Super+Shift+Down" = { action = "resize 0 30", repeat = true }
"Super+P" = "pseudo"
"Super+F" = "toggle-floating"
"Super+Shift+F" = "fullscreen"
"Super+M" = "maximize"
# Workspaces.
"Super+1" = "workspace 1"
"Super+2" = "workspace 2"
"Super+3" = "workspace 3"
"Super+4" = "workspace 4"
"Super+5" = "workspace 5"
"Super+Shift+1" = "move-to-workspace 1"
"Super+Shift+2" = "move-to-workspace 2"
"Super+Shift+3" = "move-to-workspace 3"
"Super+Shift+4" = "move-to-workspace 4"
"Super+Shift+5" = "move-to-workspace 5"
"Super+WheelDown" = "workspace e+1"
"Super+WheelUp" = "workspace e-1"
"Super+Ctrl+Right" = "workspace e+1"
"Super+Ctrl+Left" = "workspace e-1"
"Super+Ctrl+Shift+Right" = "move-to-workspace e+1"
"Super+Ctrl+Shift+Left" = "move-to-workspace e-1"
# Screenshots.
"Print" = "spawn grim -g \"$(slurp -d)\" - | wl-copy --type image/png"
"Shift+Print" = "spawn grim -g \"$(slurp -d)\" ~/Pictures/Screenshot_$(date +'%Y-%m-%d_%H-%M-%S').png && notify-send \"Captura\" \"Guardada en Imágenes\""
# Hardware and media keys; `locked` = they keep working on the lock screen.
"XF86AudioRaiseVolume" = { action = "spawn wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+", locked = true, repeat = true }
"XF86AudioLowerVolume" = { action = "spawn wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-", locked = true, repeat = true }
"XF86AudioMute" = { action = "spawn wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle", locked = true }
"XF86AudioMicMute" = { action = "spawn wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle", locked = true }
"XF86MonBrightnessUp" = { action = "spawn brightnessctl -n s 5%+", locked = true, repeat = true }
"XF86MonBrightnessDown" = { action = "spawn brightnessctl -n s 5%-", locked = true, repeat = true }
"XF86AudioPlay" = { action = "spawn playerctl play-pause", locked = true }
"XF86AudioPause" = { action = "spawn playerctl play-pause", locked = true }
"XF86AudioNext" = { action = "spawn playerctl next", locked = true }
"XF86AudioPrev" = { action = "spawn playerctl previous", locked = true }

# When nobody touches the computer: seconds before each step, 0 = never (idle.rs). Settings →
# Power writes the user's choice in hyalo-settings.toml; these are the defaults.
[idle]
screen_off = 300
lock = 600
suspend = 0

# What Hyalo animates (hyalo/compositor/src/wm/minimize.rs): a minimized window shrinking into
# its place in the dock and growing back out of it, `minimize` milliseconds — the Hyprland
# session's window animation (`windowsOut`, 400 ms). Settings → Accessibility → Reduce motion
# switches `enabled` off: then a window goes and comes back at once.
[animations]
enabled = true
minimize = 400

# How frames reach the screen (backend/tty.rs). direct_scanout: an opaque fullscreen window (a
# game) goes on the display as it is, with no composition — less latency. Set it to false if a
# fullscreen window shows wrong on your hardware (Hyprland's render:direct_scanout). Overlay
# planes are never used: the hardware blends them its own way.
[render]
direct_scanout = true

# The keyboard follows the system's (localectl set-x11-keymap) unless set here.
[input.keyboard]
repeat_delay = 600
repeat_rate = 25

[input.touchpad]
tap = true
natural_scroll = true
disable_while_typing = true

# Virtual machines: QEMU advertises a small or high-refresh preferred mode; the same default
# the Hyprland session uses (config/hypr/hyprland.lua).
[outputs.Virtual-1]
mode = "1920x1080@60"

# Outputs, by connector name (`nidara-hyalo msg outputs` lists them):
#
# [outputs.DP-1]
# mode = "2560x1440@144"
# scale = 1.25
# position = [0, 0]
# transform = "normal"
# vrr = false
