# Which portal backend serves each interface in the NIDARA session — Hyalo's, where
# XDG_CURRENT_DESKTOP=Nidara (hyprland-portals.conf is the Hyprland session's, and goes
# with it, #685). xdg-desktop-portal reads `<desktop>-portals.conf`, lowercased.
#
# 🔴 Until 2026-10-13 this file did not exist, and in the Hyalo session EVERY interface fell
# back to gtk ("Choosing gtk.portal for … as a last-resort fallback", the portal's journal):
# no screen sharing at all, the consent prompts were gtk's GTK3 dialog instead of ours,
# "Set as Desktop Background" did nothing, and `org.freedesktop.portal.Secret` was not
# exported, so a Flatpak could not keep a password. Every line below is a line of
# hyprland-portals.conf, whose comments say why each one is there; only the screen differs.
[preferred]
default=gtk

# The screen: shared in a call (ScreenCast) and taken by an app (Screenshot) —
# xdg-desktop-portal-wlr over Hyalo's ext-image-copy-capture
# (hyalo/compositor/src/capture.rs). WHAT is shared the user picks in Nidara's own picker:
# xdpw runs bin/nidara-share-chooser (xdpw-nidara.conf), and the shell draws it.
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.Screenshot=wlr

org.freedesktop.impl.portal.Settings=nidara
org.freedesktop.impl.portal.Wallpaper=nidara
org.freedesktop.impl.portal.Access=nidara
org.freedesktop.impl.portal.Secret=gnome-keyring

# ⚠️ Account, DynamicLauncher and Background are DELIBERATELY NOT routed to us — they
# grant without asking (tech-debt #89; hyprland-portals.conf has the whole reasoning).
