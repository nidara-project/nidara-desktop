# xdg-desktop-portal-wlr in the Nidara session — installed as
# /etc/xdg/xdg-desktop-portal-wlr/Nidara, the name xdpw looks for when
# XDG_CURRENT_DESKTOP=Nidara, so it applies to this session alone. A user's own
# ~/.config/xdg-desktop-portal-wlr/Nidara (or …/config) comes first.
[screencast]
# The user picks what is shared, in Nidara's picker (ui/shell/surfaces/screenshare/):
# xdpw writes the screens and windows it may share on the chooser's stdin, one per line,
# and takes back the line picked.
chooser_type=dmenu
chooser_cmd=/usr/bin/nidara-share-chooser
