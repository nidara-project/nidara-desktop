[preferred]
default=hyprland;gtk
org.freedesktop.impl.portal.ScreenCast=hyprland
org.freedesktop.impl.portal.Screenshot=hyprland
# Settings → nidara ALONE, for PRECEDENCE — not to silence anybody. It used to be
# `nidara;gtk`, because the gtk backend served `org.gnome.desktop.interface`
# (gtk-theme, icon-theme, font-name) and we did not. `bin/nidara-portal` now serves
# that namespace too, enumerated from the schema, so naming us alone loses nothing and
# the appearance contract's "one home per setting" (#534) holds for reads.
#
# ⚠️ DO NOT expect this line to cut the duplicated `SettingChanged`. It does not, and
# believing it did is why this comment used to say the opposite. Measured live on
# 2026-09-21, one mode change, listening to each bus name separately:
#
#     backend …desktop.nidara   2 signals  (one per namespace — what our code emits)
#     backend …desktop.gtk      2 signals  (still emitting, though unnamed here)
#     frontend portal.Desktop   4 signals  (it relays both backends)
#
# 🔑 A backend is loaded from its `.portal` file, not from this file. xdg-desktop-portal
# (1.22.1) AGGREGATES Settings across every backend whose `.portal` declares the
# interface and relays all of their signals; portals.conf only orders them for CALLS.
# `/usr/share/xdg-desktop-portal/portals/gtk.portal` declares it and belongs to a
# foreign package, so the only way to stop those two signals is to shadow that file —
# which breaks on the next gtk update. Not done.
#
# The duplicate is harmless: both backends read the same gsettings and answer the same
# value, so a client re-reads and gets what it already had. Redundancy, not conflict.
org.freedesktop.impl.portal.Settings=nidara
org.freedesktop.impl.portal.Wallpaper=nidara
# Access → nidara: the consent prompt (camera, microphone, location…) is drawn by
# the shell in Nidara's own look and language (bin/nidara-portal forwards it to
# org.nidara.Shell.Consent). It ASKS — every path that is not the user pressing
# Allow answers denied — which is what tech-debt #89 requires before a consent
# interface may be routed to us. Replaces gtk's GTK3 dialog (#535).
org.freedesktop.impl.portal.Access=nidara

# Secret → gnome-keyring. `gnome-keyring.portal` (shipped by gnome-keyring, a hard
# dependency of ours) implements it, but its `UseIn=gnome` is ignored as soon as a
# portals.conf exists, and `default=hyprland;gtk` names neither backend that has
# it. So the frontend never exported `org.freedesktop.portal.Secret` at all:
# libsecret inside a Flatpak failed with `ServiceUnknown` and a sandboxed app could
# not keep a password. Measured before and after in #535. Not a consent surface —
# the backend hands the app a key for ITS OWN encrypted keyring, it asks nothing
# on the user's behalf.
org.freedesktop.impl.portal.Secret=gnome-keyring

# ⚠️ Account, DynamicLauncher and Background are DELIBERATELY NOT routed here.
#
# `bin/nidara-portal` implements all three, and all three grant WITHOUT ASKING:
# `GetUserInformation` hands over the real name and avatar, `RequestInstallToken`
# and `PrepareInstall` approve a launcher install with the caller's own name and
# icon unreviewed, and `NotifyBackground` always answers "allow". An
# `impl.portal` backend IS the place where the desktop asks the user; one that
# answers yes to everything has implemented the interface and deleted the policy.
#
# 🔑 For Account and DynamicLauncher this was not a gap being filled — it was a
# REGRESSION. `gtk.portal` declares both and shows a real dialog, and `default`
# below routes them there. Naming nidara took the question away.
#
# Background is a genuine gap (no backend under Hyprland implements it), and the
# honest state of that gap is: `RequestBackground` fails, so a sandboxed app's
# "run in background / start at login" checkbox does not work. That is where we
# were before, and it is better than granting it silently — the whole reason the
# portal exists is that a sandboxed app CANNOT write ~/.config/autostart itself.
#
# The code stays in `nidara-portal` (nothing is deleted) and comes back the day
# it asks. See tech-debt #89 for what "asks" has to mean.
#
# ⚠️ REMOVING A LINE HERE IS NOT ENOUGH ON ITS OWN: the interfaces are also
# advertised in `config/portal/nidara.portal`, and xdg-desktop-portal reads BOTH.
# They were trimmed there in the same change.
