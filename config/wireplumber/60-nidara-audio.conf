# The hook is inert until the opt-in native Audio1 service advertises a controller.
wireplumber.components = [
  { name = nidara/audio.lua, type = script/lua, provides = hooks.nidara.audio,
    requires = [ metadata.default, policy.default-nodes ] }
]
wireplumber.profiles = { main = { hooks.nidara.audio = optional } }
# optional does not pull a component in by itself. The standard policy wants
# the extension without requiring it; failure cannot fail the standard policy.
wireplumber.components.rules = [
  { matches = [ { provides = policy.standard } ]
    actions = { merge = { wants = [ hooks.nidara.audio ] } } }
]
