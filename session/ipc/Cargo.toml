[package]
name = "nidara-ipc"
description = "Nidara command-line IPC, with explicit TS and Rust session routes"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
nidara-shell-ipc = { path = "../../crates/nidara-shell-ipc", default-features = false, features = ["tokio"] }
zbus = { version = "5", default-features = false, features = ["tokio", "blocking-api"] }
serde_json = "1"
gio = "0.22"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time"] }
