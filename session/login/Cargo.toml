[package]
name = "nidara-login"
description = "Nidara's login manager: the login screen on logind, PAM in a worker per session (#1195)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[[bin]]
name = "nidara-login"
path = "src/main.rs"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
tokio = { version = "1", features = ["macros", "rt", "net", "io-util", "process", "signal", "time", "sync"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
