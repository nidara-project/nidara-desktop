<?xml version="1.0"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- Nidara's login manager on the system bus (#1195 D8): switching user.
     Only root (nidara-login) owns the names. Anyone may call; the manager itself lets only
     the active session on seat0 switch (session/login/src/bus.rs). -->
<busconfig>
  <policy user="root">
    <allow own="org.nidara.Login"/>
    <allow own="org.freedesktop.DisplayManager"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.nidara.Login"
           send_interface="org.freedesktop.DisplayManager.Seat"/>
    <allow send_destination="org.freedesktop.DisplayManager"
           send_interface="org.freedesktop.DisplayManager.Seat"/>
    <allow send_destination="org.nidara.Login"
           send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="org.freedesktop.DisplayManager"
           send_interface="org.freedesktop.DBus.Introspectable"/>
  </policy>
</busconfig>
