[package]
name = "nidara-shell-ipc"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
zbus = { version = "5", default-features = false, features = ["blocking-api"] }

[features]
# Toolkit clients use zbus's async-io backend. The CLI/session workspace opts
# into Tokio without forcing the toolkit's existing blocking clients onto it.
default = ["async-io"]
async-io = ["zbus/async-io"]
tokio = ["zbus/tokio"]
